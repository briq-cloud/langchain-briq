[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "langchain-briq"
dynamic = ["version"]
description = "briq sandbox integration for Deep Agents"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["briq", "langchain", "deepagents", "sandbox", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "deepagents>=0.7.32,<0.8.0",
  "briq-cloud>=0.1.1,<0.2",
]

[project.urls]
Homepage = "https://briq.cloud"
Repository = "https://github.com/briq-cloud/langchain-briq"

[dependency-groups]
test = [
  "pytest>=8",
  "pytest-asyncio>=1.0",
  "langchain-tests>=1.1.9",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.version]
path = "langchain_briq/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["langchain_briq"]

[tool.hatch.build.targets.sdist]
include = ["langchain_briq", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore:Class-scoped fixtures defined as instance methods",
]
markers = [
  "requires: mark tests as requiring a specific library",
  "compile: placeholder test used to compile integration tests without running them",
  "scheduled: tests run on a schedule",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PT"]
ignore = ["PT018", "PT012"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["langchain_briq", "tests"]
