name: publish
# Publishes to PyPI as langchain-briq when a release tag (v0.1.0) is pushed. PyPI Trusted
# Publishing: no token, the registry trusts this workflow of this repo (a Trusted Publisher of the
# project, with no environment), and attaches the package's attestations.
on:
  push:
    tags: ["v*"]

permissions: { contents: read, id-token: write }

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
      - name: The tag is the package's version
        run: |
          set -euo pipefail
          have=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' langchain_briq/_version.py)
          test -n "$have" && test "v$have" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, package $have"; exit 1; }
      - run: uv sync --locked --group test
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build --out-dir "$RUNNER_TEMP/dist"
      - name: Install the wheel in a clean environment and import it
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" "$RUNNER_TEMP"/dist/langchain_briq-*.whl
          cd "$(mktemp -d)"
          "$RUNNER_TEMP/smoke/bin/python" -c "import langchain_briq; from langchain_briq import BriqSandbox; print(langchain_briq.__version__)"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ runner.temp }}/dist
